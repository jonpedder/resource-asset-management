<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Annotated Operations workspace</title>
  <desc id="desc">Current Operations interface with Resource Report, Request Queue, Request Approval, inventory search and filters, operational map, and the request pane with close, Cancel, and Submit Asset Request controls.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#071824"/><stop offset="1" stop-color="#0b2230"/></linearGradient>
    <linearGradient id="map" x2="1" y2="1"><stop stop-color="#173746"/><stop offset="1" stop-color="#102936"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".34"/></filter>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}.ui{fill:#f4f7f9}.muted{fill:#9eb3bf}.tiny{font-size:9px}.small{font-size:11px}.label{font-size:10px;font-weight:700;letter-spacing:.6px}.body{font-size:12px}.strong{font-weight:700}.line{stroke:#315366;stroke-width:1}.field{fill:#0a2130;stroke:#486477}.call{fill:#f2a900}.callText{fill:#071824;font-size:11px;font-weight:700}.leader{fill:none;stroke:#f2a900;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.num{fill:#071824;font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="18" y="18" width="1164" height="639" rx="8" fill="#081b27" stroke="#315366"/>
    <rect x="18" y="18" width="1164" height="60" rx="8" fill="#003b5c"/>
    <rect x="18" y="70" width="1164" height="8" fill="#003b5c"/>
    <circle cx="50" cy="48" r="21" fill="#082b40" stroke="#f2a900" stroke-width="2"/><text x="50" y="52" text-anchor="middle" fill="#f2a900" font-size="11" font-weight="700">EOC</text>
    <text x="82" y="43" class="ui strong" font-size="17">Resource &amp; Asset Management</text><text x="82" y="60" class="muted tiny">FEMA NIMS Common Operating Picture · Powered by ArcGIS Workflow Manager</text>
    <g class="body strong"><rect x="603" y="32" width="112" height="32" rx="3" fill="#0a3048" stroke="#5e7b8b"/><text x="659" y="52" text-anchor="middle" class="ui">Resource Report</text><rect x="723" y="32" width="116" height="32" rx="3" fill="#0a3048" stroke="#5e7b8b"/><text x="781" y="52" text-anchor="middle" class="ui">Request Queue  3</text><rect x="847" y="32" width="130" height="32" rx="3" fill="#f2a900"/><text x="912" y="52" text-anchor="middle" fill="#071824">Request Approval</text></g>
    <circle cx="1003" cy="48" r="5" fill="#36b37e"/><text x="1014" y="52" class="muted tiny">operator</text><rect x="1060" y="32" width="60" height="32" rx="3" fill="none" stroke="#5e7b8b"/><text x="1090" y="52" text-anchor="middle" class="ui small">Sign in</text><rect x="1128" y="32" width="34" height="32" rx="3" fill="none" stroke="#5e7b8b"/><path d="M1145 40v16M1137 48h16" stroke="#d9e4ea" stroke-width="1.5"/>
    <rect x="18" y="78" width="1164" height="30" fill="#0c2231"/><rect x="31" y="85" width="76" height="16" rx="8" fill="#123b31"/><circle cx="41" cy="93" r="3" fill="#36b37e"/><text x="49" y="97" fill="#a5f2d1" class="tiny strong">OPERATIONAL</text><text x="126" y="97" class="muted small"><tspan class="ui strong">148</tspan> resources</text><text x="225" y="97" class="muted small"><tspan class="ui strong">96</tspan> available</text><text x="316" y="97" class="muted small"><tspan class="ui strong">12</tspan> facilities</text><text x="1158" y="97" text-anchor="end" class="muted tiny">Updated moments ago</text>
    <!-- inventory -->
    <rect x="18" y="108" width="286" height="549" fill="#0c2231"/><rect x="18" y="108" width="143" height="44" fill="#123d55"/><rect x="18" y="149" width="143" height="3" fill="#f2a900"/><rect x="161" y="108" width="143" height="44" fill="#0d2b3c"/><text x="89" y="135" text-anchor="middle" fill="#f2a900" class="body strong">Resources  148</text><text x="232" y="135" text-anchor="middle" class="muted body strong">Facilities  12</text>
    <rect x="34" y="168" width="254" height="34" rx="3" class="field"/><circle cx="49" cy="184" r="5" fill="none" stroke="#9eb3bf"/><path d="M53 188l5 5" stroke="#9eb3bf"/><text x="65" y="189" class="muted small">Search resource, agency, or site</text>
    <rect x="34" y="212" width="254" height="32" rx="3" fill="#123247" stroke="#315366"/><text x="49" y="232" class="ui small strong">Filters</text><path d="M272 225l-5 6h10z" fill="#9eb3bf"/>
    <text x="45" y="264" fill="#f2a900" class="label">STATUS</text><g class="small ui"><rect x="45" y="276" width="10" height="10" rx="2" fill="#f2a900"/><path d="M47 281l2 2 4-5" fill="none" stroke="#071824"/><text x="62" y="285">Available</text><rect x="144" y="276" width="10" height="10" rx="2" fill="#0a2130" stroke="#6c8796"/><text x="161" y="285">Committed</text><rect x="45" y="298" width="10" height="10" rx="2" fill="#0a2130" stroke="#6c8796"/><text x="62" y="307">En Route</text><rect x="144" y="298" width="10" height="10" rx="2" fill="#0a2130" stroke="#6c8796"/><text x="161" y="307">Out of Service</text></g>
    <g class="small"><text x="45" y="335" class="ui strong">NIMS category</text><text x="272" y="335" class="muted">›</text><line x1="42" y1="345" x2="280" y2="345" class="line"/><text x="45" y="365" class="ui strong">Kind and type</text><text x="272" y="365" class="muted">›</text><rect x="45" y="378" width="88" height="26" rx="3" fill="none" stroke="#5e7b8b"/><text x="89" y="395" text-anchor="middle" class="muted">Clear filters</text></g>
    <g><rect x="30" y="420" width="262" height="91" rx="4" fill="#123247" stroke="#f2a900"/><rect x="30" y="420" width="4" height="91" fill="#f2a900"/><text x="46" y="443" class="ui body strong">Portable Generator</text><text x="46" y="462" class="muted small">Equipment · Generator · Type II</text><text x="46" y="480" class="muted small">County EMA · North Staging</text><rect x="209" y="434" width="67" height="18" rx="9" fill="#123b31"/><text x="242" y="447" text-anchor="middle" fill="#a5f2d1" class="tiny strong">AVAILABLE</text><text x="46" y="498" class="muted tiny">Quantity 2</text></g>
    <!-- map -->
    <rect x="304" y="108" width="526" height="549" fill="url(#map)"/><path d="M304 570l95-88 73 25 91-118 93 44 85-111 89 39v296H304z" fill="#244553"/><path d="M326 226c105 50 164 20 254 76s157 28 236-18M343 612c86-98 158-63 236-126s145-28 231-97" fill="none" stroke="#6d8794" stroke-width="3" opacity=".75"/><path d="M469 108v549M650 108v549" stroke="#294a59" opacity=".45"/><g fill="#36b37e" stroke="#e9f2f6" stroke-width="2"><circle cx="493" cy="339" r="8"/><circle cx="715" cy="492" r="8"/></g><circle cx="604" cy="398" r="12" fill="#f2a900" stroke="#fff" stroke-width="3"/>
    <g fill="#092130" stroke="#678290"><rect x="320" y="126" width="30" height="30" rx="3"/><rect x="320" y="160" width="30" height="30" rx="3"/><rect x="320" y="202" width="30" height="30" rx="3"/><rect x="320" y="236" width="30" height="30" rx="3"/></g><path d="M329 141h12M335 135v12M329 175h12" stroke="#dce7ec"/><path d="M328 213h14M328 219h14M328 225h14M327 251l8-8 8 8-8 8z" fill="none" stroke="#dce7ec"/>
    <rect x="548" y="119" width="265" height="27" rx="13" fill="#092130" fill-opacity=".9"/><circle cx="565" cy="132" r="4" fill="#36b37e"/><text x="577" y="136" class="ui tiny">Resources by status</text><circle cx="691" cy="132" r="4" fill="#4fa3d1"/><text x="702" y="136" class="ui tiny">Facilities by type</text>
    <!-- request pane -->
    <rect x="830" y="108" width="352" height="549" fill="#0c2231"/><rect x="830" y="108" width="352" height="64" fill="#0d3045"/><text x="848" y="133" class="ui body strong">Request Selected Asset</text><text x="848" y="151" class="muted tiny">Create an ICS 213RR request from the selected item</text><rect x="1138" y="119" width="28" height="28" rx="3" fill="#123247" stroke="#5e7b8b"/><path d="M1147 128l10 10m0-10l-10 10" stroke="#f4f7f9" stroke-width="1.5"/>
    <rect x="846" y="184" width="320" height="53" rx="4" fill="#123d55"/><text x="860" y="202" fill="#f2a900" class="label">SELECTED INVENTORY ASSET</text><text x="860" y="222" class="ui body strong">Portable Generator · Type II</text>
    <g class="small"><text x="846" y="258" class="ui strong">Request Title</text><rect x="846" y="266" width="152" height="28" rx="3" class="field"/><text x="1008" y="258" class="ui strong">Incident Name</text><rect x="1008" y="266" width="158" height="28" rx="3" class="field"/><text x="846" y="314" class="ui strong">Requestor</text><rect x="846" y="322" width="152" height="28" rx="3" class="field"/><text x="1008" y="314" class="ui strong">Priority</text><rect x="1008" y="322" width="158" height="28" rx="3" class="field"/><text x="846" y="370" class="ui strong">Quantity Requested</text><rect x="846" y="378" width="152" height="28" rx="3" class="field"/><text x="1008" y="370" class="ui strong">Date Needed</text><rect x="1008" y="378" width="158" height="28" rx="3" class="field"/><text x="846" y="426" class="ui strong">Current Resource Location</text><rect x="846" y="434" width="320" height="28" rx="3" class="field"/><text x="857" y="452" class="muted tiny">North Staging Area</text><text x="846" y="482" class="ui strong">Notes / Justification</text><rect x="846" y="490" width="320" height="76" rx="3" class="field"/></g>
    <line x1="830" y1="584" x2="1182" y2="584" class="line"/><rect x="918" y="600" width="82" height="36" rx="3" fill="none" stroke="#6c8796"/><text x="959" y="623" text-anchor="middle" class="ui small strong">Cancel</text><rect x="1010" y="600" width="156" height="36" rx="3" fill="#f2a900"/><text x="1088" y="623" text-anchor="middle" fill="#071824" class="small strong">Submit Asset Request</text>
  </g>
  <!-- annotations -->
  <g><path d="M656 23V31" class="leader"/><circle cx="656" cy="18" r="12" class="call"/><text x="656" y="18" class="num">1</text><rect x="523" y="4" width="118" height="25" rx="12" class="call"/><text x="582" y="21" text-anchor="middle" class="callText">Resource Report</text>
  <path d="M782 23V31" class="leader"/><circle cx="782" cy="18" r="12" class="call"/><text x="782" y="18" class="num">2</text><rect x="791" y="4" width="112" height="25" rx="12" class="call"/><text x="847" y="21" text-anchor="middle" class="callText">Request Queue</text>
  <path d="M912 74v-9" class="leader"/><circle cx="912" cy="84" r="12" class="call"/><text x="912" y="84" class="num">3</text><rect x="925" y="73" width="126" height="24" rx="12" class="call"/><text x="988" y="90" text-anchor="middle" class="callText">Request Approval</text>
  <path d="M18 349H8" class="leader"/><circle cx="18" cy="349" r="12" class="call"/><text x="18" y="349" class="num">4</text><rect x="28" y="337" width="143" height="24" rx="12" class="call"/><text x="99" y="354" text-anchor="middle" class="callText">Inventory &amp; filters</text>
  <path d="M1174 131h-8" class="leader"/><circle cx="1178" cy="131" r="12" class="call"/><text x="1178" y="131" class="num">5</text><rect x="1037" y="146" width="132" height="24" rx="12" class="call"/><text x="1103" y="163" text-anchor="middle" class="callText">Close request pane</text>
  <path d="M1001 648v-11" class="leader"/><circle cx="1001" cy="648" r="12" class="call"/><text x="1001" y="648" class="num">6</text><rect x="1015" y="641" width="157" height="24" rx="12" class="call"/><text x="1093" y="658" text-anchor="middle" class="callText">Cancel or submit</text></g>
</svg>
